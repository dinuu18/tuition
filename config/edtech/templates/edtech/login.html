{% extends "edtech/base.html" %}{% block title %}Login — Tuition.com{% endblock %}{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <span class="kicker">Welcome back</span>
    <h1>Sign in to your account</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      <label for="login-username">Username</label>
      <input id="login-username" name="username" autocomplete="username" required>
      <label for="login-password">Password</label>
      <div class="password-field">
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"><i data-lucide="eye" aria-hidden="true"></i></button>
      </div>
      <button class="btn primary full" type="submit">Login</button>
    </form>
    <p>New here? <a href="{% url 'register' role='student' %}">Create a student account</a></p>
  </div>
</section>
{% endblock %}
