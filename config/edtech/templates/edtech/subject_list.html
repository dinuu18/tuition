{% extends "edtech/base.html" %}{% block content %}<section class="section"><div class="section-heading"><div><span class="kicker">All subjects</span><h1>What do you want to learn?</h1></div></div><div class="subject-grid">{% for subject in subjects %}<a class="subject-card" href="{% url 'subject_detail' subject.slug %}"><div class="subject-icon"><i data-lucide="{{ subject.icon }}"></i></div><strong>{{ subject.name }}</strong><span>{{ subject.category }}</span></a>{% empty %}<div class="empty-state">No subjects available.</div>{% endfor %}</div></section>{% endblock %}
